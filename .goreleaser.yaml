version: 2
project_name: nota

before:
  hooks:
    - go test ./...

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/dignajar/nota/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

# Publishes a Homebrew cask to dignajar/homebrew-tap on every release.
# Needs a HOMEBREW_TAP_TOKEN repo secret: a fine-grained PAT with
# "Contents: read and write" on dignajar/homebrew-tap (GITHUB_TOKEN cannot
# push to another repository).
homebrew_casks:
  - repository:
      owner: dignajar
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/dignajar/nota
    description: Capture notes and reminders without leaving the terminal
    license: MIT
    # The binary is not notarized: clear the quarantine flag Homebrew sets.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/nota"]
          end
